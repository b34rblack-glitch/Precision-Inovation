# Builds an installable Android APK on every push and on demand, and keeps the
# newest one for each branch as a GitHub Release so it has a plain download
# link: https://github.com/<owner>/<repo>/releases/tag/apk-<branch>
#
# The APK is signed with the debug keystore Expo generates, which is enough to
# sideload onto a phone. A store upload would need a real keystore; see
# ANDROID_BUILD.md.
name: Android APK

on:
  push:
    branches: ['**']
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck and test
        run: |
          npm run typecheck
          npm test

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build the release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Name the APK
        id: apk
        run: |
          version=$(node -p "require('./app.json').expo.version")
          branch="${GITHUB_REF_NAME//\//-}"
          name="precision-innovation-${version}-${branch}-${GITHUB_SHA::7}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error

      # One release per branch, replaced on every build, so the link in
      # ANDROID_BUILD.md always serves the newest APK for that branch.
      - name: Publish as the branch's release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: apk-${{ steps.apk.outputs.branch }}
          APK: ${{ steps.apk.outputs.name }}
        run: |
          gh release delete "$TAG" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          prerelease=""
          if [ "$GITHUB_REF_NAME" != "${{ github.event.repository.default_branch }}" ]; then prerelease="--prerelease"; fi
          gh release create "$TAG" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Android APK · ${{ steps.apk.outputs.branch }} · v${{ steps.apk.outputs.version }}" \
            --notes "Built from \`${GITHUB_SHA::7}\` on \`${GITHUB_REF_NAME}\` by the Android APK workflow. Download the .apk below and open it on the phone; see ANDROID_BUILD.md for install steps." \
            $prerelease
